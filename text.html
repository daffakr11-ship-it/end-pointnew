<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dapz Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HALAMAN 1 -->
<div class="container" id="page1">
  <h1>Dapz Store</h1>
  <h2>Pilih Game</h2>

  <div class="grid">
    <div class="card" onclick="pilihGame('Free Fire')">FF</div>
    <div class="card" onclick="pilihGame('Mobile Legends')">ML</div>
    <div class="card" onclick="pilihGame('Roblox')">Roblox</div>
  </div>
</div>

<!-- HALAMAN 2 -->
<div class="container hidden" id="page2">
  <div class="back" onclick="kembali()">← Kembali</div>
  <h1>Dapz Store</h1>
  <h2 id="judulGame">Top Up</h2>

  <input type="text" id="userId" placeholder="Masukkan ID Game">

  <div><b>Pilih Diamond</b></div>
  <div class="grid">
    <div class="card" onclick="pilihDiamond(this, '86 DM - 20K')">86 DM</div>
    <div class="card" onclick="pilihDiamond(this, '172 DM - 40K')">172 DM</div>
    <div class="card" onclick="pilihDiamond(this, '257 DM - 60K')">257 DM</div>
    <div class="card" onclick="pilihDiamond(this, '514 DM - 120K')">514 DM</div>
  </div>

  <button onclick="kirimData()">Top Up Sekarang</button>
</div>

<script src="script.js"></script>
</body>
</html>
